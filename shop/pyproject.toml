[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deboog-shop"
version = "0.1"
description = "Digital book shop for deboog.apsurt.nl, interim on port 9000"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
]

[project.scripts]
shop = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
