[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deboog-shop"
version = "0.1"
description = "Paper book shop for deboog.apsurt.nl, interim on port 9000"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "pyodbc>=5.3.0",
  "pyjwt>=2.15.1",
  "cryptography>=50.0.2",
  "reportlab>=5.0.1",
]

[project.scripts]
shop = "app.main:run"
admin = "app.admin:run"
remind = "app.reminders:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
