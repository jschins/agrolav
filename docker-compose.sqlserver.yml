services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agrolav-sql
    hostname: boekhouding
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set in the root /.env}
    ports:
      - "1433:1433"
    volumes:
      - "${AGROLAV_SQL_DISK:-C:/SQLBackups}:/var/opt/mssql/backup"