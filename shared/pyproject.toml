[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-app-shared"
version = "0.1"
description = "Login access helpers shared by boekhouding hub and client"
requires-python = ">=3.11"
license = "Apache-2.0"

authors = [
  { name = "juleon", email = "j.m.schins@gmail.com" }
]

dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]
