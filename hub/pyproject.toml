[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boekhouding-hub"
version = "0.1"
description = "Always-on boekhouding hub: sync, merge, calculation under server/workspaces"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

dependencies = [
  "banking-app-shared",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.6.0",
  "python-multipart>=0.0.9",
  "requests>=2.31.0",
  "PyJWT>=2.8.0",
  "cryptography>=42.0.0",
  "tzdata>=2024.1",
  "pyodbc>=5.3.0",
]

[project.scripts]
hub = "app.main:run"
boekhouding-hub = "app.main:run"

[dependency-groups]
build = ["pyinstaller>=6.0"]

[tool.uv.sources]
banking-app-shared = { path = "../shared", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
